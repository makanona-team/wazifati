plugins {
    id 'com.android.application'
}

// مفتاح التوقيع يأتي من GitHub Actions (السر SIGN_PASS). بدونه يُبنى إصدار تجريبي فقط.
def ksPath = System.getenv('WZ_KEYSTORE')
// عنوان الخادم يُمرَّر من خطوة نشر Cloudflare في نفس سير العمل.
def apiUrl = System.getenv('WZ_API') ?: ''
// معرّف عميل Google (Web client ID) من الملف config/google-client-id.txt
def gcidFile = rootProject.file('config/google-client-id.txt')
def googleClientId = gcidFile.exists() ? gcidFile.text.trim() : ''

android {
    namespace 'com.feras.wazifati'
    compileSdk 35

    defaultConfig {
        applicationId 'com.feras.wazifati'
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName '3.1.1'
        buildConfigField 'String', 'API_URL', "\"${apiUrl}\""
        buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${googleClientId}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('WZ_PASS')
                keyAlias 'wazifati'
                keyPassword System.getenv('WZ_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir '../changelogs'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "Wazifati-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    // 3.0.4: صريحة — كانت androidx.core مفقودة من ملف التطبيق فينهار دخول Google على أندرويد 13 وأقدم
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
